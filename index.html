<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GOOD FIND WEAR — curated looks and the pieces behind them.">
  <title>GOOD FIND WEAR — Looks</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#top">GOOD FIND WEAR<span>LOOK GOOD. FIND BETTER.</span></a>
    <span class="header-note">CURATED LOOKS</span>
  </header>
  <main id="top">
    <section class="intro">
      <p class="eyebrow">GOOD FIND WEAR</p>
      <h1>Find your look.</h1>
      <p>Pick a GOODFIND ID. Open the look. Tap the piece you want.</p>
    </section>
    <section class="looks" aria-label="Good Find Wear looks">
      <div class="section-label"><span>LOOKS</span><span>NEWEST FIRST</span></div>
      <div id="lookGrid" class="look-grid"></div>
    </section>
  </main>
  <div id="breakdownModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" type="button" aria-label="Close" data-close>×</button>
      <div class="modal-image" id="modalImage"></div>
      <div class="modal-content">
        <p class="eyebrow" id="modalId"></p>
        <h2 id="modalTitle"></h2>
        <p class="modal-theme" id="modalTheme"></p>
        <div class="items" id="modalItems"></div>
      </div>
    </section>
  </div>
  <footer>
    <div><strong>GOOD FIND WEAR</strong><span>LOOK GOOD. FIND BETTER.</span></div>
    <a href="https://instagram.com/goodfindwear" target="_blank" rel="noreferrer">@goodfindwear</a>
  </footer>
  <script src="./script.js"></script>
</body>
</html>
